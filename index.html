<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technical Assessment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
      <div class="item1">
        <div class="jeremy">
          <img src="images/image-jeremy.png" alt="">
        
        <div class="jeremy2">
          <p>Report for</p>
          <h2>Jeremy <br> Robson</h2>
        </div>
        </div>
        <div class="jeremy3">
          <p>Daily</p>
          <h5>Weekly</h5>
          <p>Monthly</p>
        </div>
      </div>
      <div class="item2">
        <img src="./images/icon-work.svg" alt="">
        <div class="card">
          <div class="card-1">
            <h5>Work</h5>
            <img src="./images/icon-ellipsis.svg" alt="">
          </div>
          <div class="card-2">
            <h1>32hrs</h1>
            <h6>Last week-36hrs</h6>
          </div>
        </div>
      </div>
      <div class="item3">
        <img src="./images/icon-play.svg" alt="">
        <div class="card">
          
          <div class="card-1">
            <h5>Play</h5>
            <img src="./images/icon-ellipsis.svg" alt="">
          </div>
          <div class="card-2">
            <h1>10hrs</h1>
            <h6>Last week-8hrs</h6>
          </div>
        </div>
      </div>
      <div class="item4">
        <img src="./images/icon-study.svg" alt="">
        <div class="card">
          
          <div class="card-1">
            <h5>Study</h5>
            <img src="./images/icon-ellipsis.svg" alt="">
          </div>
          <div class="card-2">
            <h1>4hrs</h1>
            <h6>Last week-7hrs</h6>
          </div>
        </div>
      </div>
      <div class="item5">
        <img src="./images/icon-exercise.svg" alt="">
        <div class="card">
          <div class="card-1">
            <h5>Exercise</h5>
            <img src="./images/icon-ellipsis.svg" alt="">
          </div>
          <div class="card-2">
            <h1>4hrs</h1>
            <h6>Last week-5hrs</h6>
          </div>
        </div>
      </div>
      <div class="item6">
        <img src="./images/icon-social.svg" alt="" height="50px" width="50px">
        <div class="card">
          <div class="card-1">
            <h5>Social</h5>
            <img src="./images/icon-ellipsis.svg" alt="">
          </div>
          <div class="card-2">
            <h1>5hrs</h1>
            <h6>Last week-10hrs</h6>
          </div>
        </div>
      </div>
      <div class="item7">
        <img src="./images/icon-self-care.svg" alt="">
        <div class="card">
          <div class="card-1">
            <h5>SelfCare</h5>
            <img src="./images/icon-ellipsis.svg" alt="">
          </div>
          <div class="card-2">
            <h1>2hrs</h1>
            <h6>Last week-2hrs</h6>
          </div>
        </div>
      </div>
      
    </div>

</html>
